name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
          POSTGRES_DB: jobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JQ_TEST_DATABASE_URL: postgres://jobs:jobs@localhost:5432/jobs_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (unit + PostgreSQL)
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --profile stack config -q
      - name: Build image
        run: docker build -t go-jobqueue:ci .
      - name: Smoke test the stack
        run: |
          docker compose --profile stack up -d --build
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/readyz && curl -fsS localhost:8081/readyz && break
            sleep 2
          done
          # Enqueue on instance 1; either instance may run it. The job must
          # end succeeded, and both instances must expose metrics.
          id=$(curl -fsS -X POST localhost:8080/v1/jobs -H 'Content-Type: application/json' \
            -d '{"type":"demo.sleep","payload":{"ms":50}}' | sed -E 's/.*"id":([0-9]+).*/\1/')
          for i in $(seq 1 15); do
            curl -fsS localhost:8081/v1/jobs/$id | grep -q '"state":"succeeded"' && ok=1 && break
            sleep 1
          done
          curl -fsS localhost:8080/metrics | grep -q '^jobqueue_jobs{state="succeeded"} ' || ok=
          curl -fsS localhost:8081/metrics | grep -q '^jobqueue_claims_total' || ok=
          curl -fsS localhost:9090/-/ready || ok=
          [ -n "$ok" ] && exit 0
          docker compose --profile stack logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose --profile stack down -v
